# Optional remote MCP test deployment. No disk or paid database is provisioned.
# Authentication sessions and generated files are memory-only. Restart requires reconnecting.
# Free services sleep; use the offline Skill for workflows that need no server.
services:
  - type: web
    name: kdca-press
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_MODE
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GITHUB_IDS
        sync: false
