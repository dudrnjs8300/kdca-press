name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python3 -m pip install uv==0.12.23
      - run: python3 scripts/build-worker-engine.py
      - name: Prepare Python worker
        working-directory: workers/engine
        run: uv run --locked pywrangler deploy --dry-run
      - run: node test/workers-runtime.mjs
      - name: Save timings and generated examples
        uses: actions/upload-artifact@v4
        with:
          name: workers-runtime-results
          path: |
            test-output/workers/benchmark.json
            test-output/workers/*.hwpx
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Browser OAuth consent regression
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node test/oauth-browser.mjs
      - run: python3 test/pc_setup_test.py
      - name: Check Windows startup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/pc/enable-autostart.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Write-Error; exit 1 }
      - run: npm run build:packages
      - uses: actions/upload-artifact@v4
        with:
          name: kdca-press-packages
          path: dist/
